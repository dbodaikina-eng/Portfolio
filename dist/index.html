  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"29b42920-ca2c-4db7-acb8-3d77163a5d37\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* ============================================================\n   vibe — Brand colors (semantic layer)\n   ------------------------------------------------------------\n   Base palette + Figma Variables live in fig-tokens.css. This file\n   adds the *brand-legible* aliases the vibe product actually uses:\n   the red wordmark, the electric-blue primary, the like/dislike\n   hearts, the candy backdrop colors and the glassy button fills.\n   ============================================================ */\n\n:root {\n  /* ---- Core brand ---- */\n  --vibe-red:            rgb(240, 63, 53);   /* the \"vibe\" wordmark */\n  --vibe-blue:           rgb(12, 105, 255);  /* primary action / accent */\n  --vibe-blue-bright:    rgb(0, 117, 254);\n  --vibe-blue-cyan:      rgb(116, 235, 255); /* gradient tail */\n  --vibe-yellow:         rgb(255, 204, 0);   /* signature backdrop */\n  --vibe-yellow-deep:    rgb(255, 228, 0);\n  --vibe-heart:          rgb(255, 45, 146);  /* the \"like\" heart */\n  --vibe-heart-soft:     rgb(255, 143, 154);\n\n  /* ---- Candy backdrops (collage canvas) ---- */\n  --vibe-bg-yellow:      rgb(255, 214, 0);\n  --vibe-bg-lilac:       rgb(228, 226, 252);\n  --vibe-bg-mint:        rgb(157, 181, 156);\n  --vibe-bg-paper:       rgb(234, 234, 234);\n\n  /* ---- Ink ---- */\n  --vibe-ink:            rgb(10, 12, 17);     /* primary text */\n  --vibe-ink-60:         rgba(10, 12, 17, 0.6);\n  --vibe-ink-30:         rgba(10, 12, 17, 0.3);\n  --vibe-surface:        rgb(255, 255, 255);\n  --vibe-surface-2:      rgb(244, 244, 244);\n  --vibe-hairline:       rgb(231, 231, 231);\n\n  /* ---- Status ---- */\n  --vibe-success:        rgb(64, 155, 63);\n  --vibe-danger:         rgb(223, 36, 36);\n  --vibe-warning:        rgb(246, 149, 74);\n\n  /* ---- Semantic aliases used by components ---- */\n  --text-1:              var(--vibe-ink);\n  --text-2:              var(--vibe-ink-60);\n  --text-3:              var(--vibe-ink-30);\n  --text-on-accent:      rgb(255, 255, 255);\n  --surface-card:        var(--vibe-surface);\n  --surface-sunken:      var(--vibe-surface-2);\n  --accent:              var(--vibe-blue);\n  --hairline:            var(--vibe-hairline);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   vibe — Effects: radii, spacing, shadows & the glass system\n   ------------------------------------------------------------\n   vibe's controls are skeuomorphic \"liquid glass\": gradient fills\n   with an inset top sheen, a hairline rim and a soft drop shadow.\n   These tokens capture that recipe so components stay consistent.\n   ============================================================ */\n\n:root {\n  /* ---- Radii ---- */\n  --vibe-radius-xs:   6px;\n  --vibe-radius-sm:   10px;\n  --vibe-radius-md:   14px;\n  --vibe-radius-lg:   20px;\n  --vibe-radius-xl:   28px;\n  --vibe-radius-pill: 100px;\n  --vibe-radius-sheet: 34px;   /* iOS bottom-sheet top corners */\n\n  /* ---- Spacing (4pt grid) ---- */\n  --vibe-space-1: 2px;\n  --vibe-space-2: 4px;\n  --vibe-space-3: 8px;\n  --vibe-space-4: 12px;\n  --vibe-space-5: 16px;\n  --vibe-space-6: 20px;\n  --vibe-space-7: 24px;\n  --vibe-space-8: 32px;\n  --vibe-space-9: 40px;\n\n  /* ---- Drop shadows / elevation ---- */\n  --vibe-shadow-control: 0 0 1.5px 0.5px rgba(0,0,0,0.15), 0 6px 12px 0 rgba(0,0,0,0.1);\n  --vibe-shadow-card:    0 8px 24px 0 rgba(0,0,0,0.12);\n  --vibe-shadow-pop:     0 12px 32px 0 rgba(0,0,0,0.18);\n  --vibe-shadow-float:   0 8px 12px 0 rgba(124,124,124,0.16), 0 0 1.5px 0 rgba(0,0,0,0.15);\n  --vibe-ring-blue:      0 0 2px 0 rgba(11,97,233,0.64);\n  --vibe-ring-danger:    0 0 2px 0 rgba(218,0,0,0.64);\n\n  /* ---- Glass / gradient fills ---- */\n  --vibe-glass-blue:   linear-gradient(180deg, rgb(0,117,254) 0%, rgb(116,235,255) 100%); /* @kind color */\n  --vibe-glass-gray:   linear-gradient(180deg, rgb(196,196,196) 0%, rgb(244,244,244) 100%); /* @kind color */\n  --vibe-glass-white:  linear-gradient(180deg, rgb(231,231,231) 0%, rgb(254,254,254) 100%); /* @kind color */\n  --vibe-glass-frost:  linear-gradient(180deg, rgba(196,196,196,0.7) 10%, rgba(244,244,244,0.7) 100%); /* @kind color */\n  --vibe-sheen:        linear-gradient(180deg, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0) 100%); /* @kind color */\n\n  /* ---- Inset rims (apply as box-shadow on top of a fill) ---- */\n  --vibe-rim-blue:  inset 0 0 0 1px rgb(12,105,255), inset 0 -2px 6px 0 rgba(0,117,254,0.48), inset 0 0 3px 0 rgba(0,0,0,0.25); /* @kind shadow */\n  --vibe-rim-gray:  inset 0 0 0 1px rgb(196,196,196), inset 0 -2px 4px 0 rgba(196,196,196,0.48), inset 0 0 3px 0 rgba(0,0,0,0.25); /* @kind shadow */\n}\n<\u002Fstyle>\n<script src=\"02d18522-8b5a-4dc7-b97a-6ad9e9f0f496\"><\u002Fscript>\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: italic;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"0238a2c3-ff60-48e6-a51e-e0362b85887d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: italic;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"6cef5c89-6fa3-46d5-a16c-ed967a0cadfd\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@ \n                  <\u002Ful>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.noBullets }}\" hint-placeholder-val=\"{{ true }}\">\n                  <p style=\"margin: 0; font-size: clamp(14px, 1.15vw, 19px); line-height: 1.45; letter-spacing: -0.01em; max-height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(10,12,17,0.25) transparent; text-wrap: pretty;\">{{ p.body }}<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ contactOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeContact }}\" style=\"position: fixed; inset: 0; z-index: 50; background: rgba(10,12,17,0.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 24px;\">\n      <div sc-camel-on-click=\"{{ stop }}\" role=\"dialog\" aria-label=\"Contact\" style=\"width: min(100%, 460px); padding: clamp(22px, 2.6vw, 32px); box-sizing: border-box; border-radius: 2px; background: linear-gradient(160deg, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0.9) 100%); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0 30px 70px -20px rgba(20,24,40,0.35); display: flex; flex-direction: column; gap: 18px; font-family: 'Space Mono', ui-monospace, monospace; color: #0A0C11;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n          <div style=\"font-family: 'Archivo', sans-serif; font-weight: 700; font-size: clamp(22px, 2vw, 28px); line-height: 1; letter-spacing: -0.03em;\">Contact me<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeContact }}\" role=\"button\" aria-label=\"Close\" style=\"width: 36px; height: 36px; display: grid; place-items: center; border-radius: 2px; cursor: pointer; font-size: 20px; line-height: 1;\" style-hover=\"background: rgba(10,12,17,0.06)\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 2px; background: rgba(10,12,17,0.05); box-shadow: inset 0 0 0 1px rgba(10,12,17,0.12);\">\n          <span style=\"flex: 1 1 auto; min-width: 0; font-size: clamp(13px, 1vw, 16px); overflow-wrap: anywhere;\">d.bodaikina@gmail.com<\u002Fspan>\n          <div sc-camel-on-click=\"{{ copyEmail }}\" role=\"button\" style=\"flex: 0 0 auto; padding: 8px 14px; border-radius: 2px; background: #0A0C11; color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; transition: transform 160ms ease;\" style-hover=\"transform: scale(1.04)\">{{ copyLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n          <a href=\"mailto:d.bodaikina@gmail.com\" style=\"flex: 1 1 auto; text-align: center; padding: 12px 16px; border-radius: 2px; background: #F65A3C; color: #fff; text-decoration: none; font-size: 14px;\">Open mail app<\u002Fa>\n          <a href=\"https://t.me/bodaikina\" target=\"_blank\" rel=\"noopener\" style=\"flex: 1 1 auto; text-align: center; padding: 12px 16px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(10,12,17,0.35); color: #0A0C11; text-decoration: none; font-size: 14px;\">Telegram @bodaikina<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div id=\"om-whale\" style=\"position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none; will-change: transform;\">\n    <div ref=\"{{ whaleWrap }}\" style=\"position: relative; width: 30px; height: 24px; filter: drop-shadow(0 2px 3px rgba(20,40,55,0.28)); will-change: transform;\">\n      <img ref=\"{{ whaleTail }}\" src=\"559b860a-99c8-4ad9-8d25-ccc797d3eb48\" alt=\"\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 66.3% 35.5%; will-change: transform;\">\n      <img src=\"c73600ab-2ea3-4e0e-bbf1-ac6c2cbbb5e3\" alt=\"\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whaleCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Whale cursor&quot;},&quot;whaleSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:20,&quot;max&quot;:160,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Whale cursor&quot;},&quot;tailEnergy&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.5,&quot;min&quot;:0.3,&quot;max&quot;:2.2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Whale cursor&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: 0, sheet: false, caseStep: 0, contact: false, copied: false };\n  whaleWrap = React.createRef();\n  whaleTail = React.createRef();\n  whale = { x: -200, y: -200, tx: -200, ty: -200, vx: 0, vy: 0, dir: 1, wag: 0, phase: 0, last: 0, raf: 0 };\n  onPointer = (e) => { this.whale.tx = e.clientX; this.whale.ty = e.clientY; };\n  whaleTick = (t) => {\n    const w = this.whale, wrap = this.whaleWrap.current, tail = this.whaleTail.current;\n    const on = this.props.whaleCursor ?? true;\n    document.documentElement.toggleAttribute(\"data-whale-off\", !on);\n    if (wrap && tail && on) {\n      const dt = Math.min(3, (t - (w.last || t)) / 16.67); w.last = t;\n      const size = this.props.whaleSize ?? 30, energy = this.props.tailEnergy ?? 1.5;\n      const k = Math.min(1, 0.17 * dt);\n      const nx = w.x + (w.tx - w.x) * k, ny = w.y + (w.ty - w.y) * k;\n      w.vx = nx - w.x; w.vy = ny - w.y; w.x = nx; w.y = ny;\n      if (Math.abs(w.vx) > 0.4) w.dir = w.vx > 0 ? 1 : -1;\n      const speed = Math.hypot(w.vx, w.vy);\n      w.wag += (Math.min(1, speed / 18) - w.wag) * 0.12 * dt;\n      w.phase += (0.09 + w.wag * 0.34) * dt * energy;\n      const amp = (3 + w.wag * 17) * energy;\n      const tilt = Math.max(-14, Math.min(14, w.vy * 1.4)) * w.dir;\n      const hx = size * (w.dir === 1 ? 0.97 : 0.03);\n      wrap.style.width = size + \"px\"; wrap.style.height = size * 0.798 + \"px\";\n      wrap.style.transform = \"translate(\" + (w.x - hx) + \"px,\" + (w.y - size * 0.268) + \"px) scaleX(\" + w.dir + \") rotate(\" + tilt + \"deg)\";\n      tail.style.transform = \"rotate(\" + (Math.sin(w.phase) * amp) + \"deg)\";\n    }\n    w.raf = requestAnimationFrame(this.whaleTick);\n  };\n  lastStep = 0;\n  count = 5;\n  step(dir) {\n    const now = Date.now();\n    if (now - this.lastStep < 520) return true;\n    const next = this.state.active + dir;\n    if (next < 0 || next > this.count - 1) return false;\n    this.lastStep = now;\n    this.setState({ active: next, sheet: false });\n    return true;\n  }\n  onWheel = (e) => {\n    if (window.innerWidth <= 760) return;\n    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;\n    if (this.state.sheet || this.state.contact) return;\n    if (Math.abs(d) < 6) return;\n    if (this.step(d > 0 ? 1 : -1)) e.preventDefault();\n  };\n  onKey = (e) => {\n    if (e.key === \"Escape\" && this.state.contact) { this.setState({ contact: false }); return; }\n    if (this.state.contact) return;\n    if (e.key === \"Escape\" && this.state.sheet) { this.setState({ sheet: false }); return; }\n    if (this.state.sheet) return;\n    if (e.key === \"ArrowRight\" || e.key === \"ArrowDown\") this.step(1);\n    if (e.key === \"ArrowLeft\" || e.key === \"ArrowUp\") this.step(-1);\n  };\n  componentDidMount() {\n    window.addEventListener(\"wheel\", this.onWheel, { passive: false });\n    window.addEventListener(\"keydown\", this.onKey);\n    window.addEventListener(\"pointermove\", this.onPointer, { passive: true });\n    this.whale.raf = requestAnimationFrame(this.whaleTick);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"wheel\", this.onWheel);\n    window.removeEventListener(\"keydown\", this.onKey);\n    window.removeEventListener(\"pointermove\", this.onPointer);\n    cancelAnimationFrame(this.whale.raf);\n    document.documentElement.removeAttribute(\"data-whale-off\");\n  }\n  goTo(i) { this.lastStep = Date.now(); this.setState({ active: i, sheet: false }); }\n  renderVals() {\n    const data = [\n      [\"About me\", \"I’m a Senior Product AI Designer with 8+ years of experience working in cross-functional teams, mainly in fintech over the past 5 years, with additional experience in e-commerce and edtech. I combine product thinking, AI, UX, and a deep understanding of user behavior and psychology to solve complex problems fast and effectively. Hire me when you need to move fast, solve complex product problems, and build for real user behavior.\", \"Portrait photo\"],\n      [\"AI in design\", \"\", \"\"],\n      [\"Showreel\", \"Design before the AI era. Most of my recent work is under NDA, so I use selected older cases not as a gallery of current UI trends, but as evidence of how I think.\", \"Showreel\", \"https://dbodaikina-eng.github.io/portfolio2026/showreel.gif\"],\n      [\"Case: Cross-Border Invoicing Flow\", \"\", \"Invoicing flow — mobile screens\", \"case-crossborder.png\"],\n      [\"Biography\", [[\"2025–Now\", \"AI Product Designer: AI is part of my full product process, from research and hypothesis testing to fast shipping.\"], [\"2021–2025\", \"Senior/Staff Product Designer in startups and FinTech: owning the product as a whole and leading projects and designers.\"], [\"2016–2021\", \"Product Designer: Junior to Senior in 3.5 years, 100+ shipped projects, team grew from 2 to 10.\"], [\"2014–2016\", \"Communication Designer → IT consulting.\"], [\"Before 2014\", \"Art → Design: six years of design studies after many years of art.\"]], \"\"]\n    ];\n    const active = this.state.active;\n    const CASE = {\n      summary: \"A step-by-step invoicing flow that adapts to each country's legal requirements — 95% completion in pre-launch testing.\",\n      sections: [\n        { label: \"Challenge\", text: \"Cross-border invoicing for different countries, each with local legal requirements and a different set of steps. Long forms on one screen overwhelmed users.\" },\n        { label: \"Approach\", text: \"I broke the flow into small, logical steps and adapted the questions to each jurisdiction — shorter forms instead of long screens to reduce cognitive load.\" },\n        { label: \"Outcome\", text: \"95% task completion in pre-launch UX testing (n=15): 44 sec. on the first attempt without training, 30 sec. on repeat attempts. A scalable flow that adapts to new jurisdictions and is optimised step by step.\" }\n      ],\n      metrics: [\n        { value: \"95%\", label: \"task completion, n=15\" },\n        { value: \"44 s\", label: \"first attempt, no training\" },\n        { value: \"30 s\", label: \"repeat attempts\" }\n      ]\n    };\n    const step = this.state.caseStep;\n    const caseVals = {\n      caseSummary: CASE.summary,\n      caseSections: CASE.sections,\n      caseMetrics: CASE.metrics,\n      sheetOpen: this.state.sheet,\n      openSheet: (e) => { e.stopPropagation(); this.setState({ sheet: true }); },\n      closeSheet: (e) => { e.stopPropagation(); this.setState({ sheet: false }); },\n      caseTabs: CASE.sections.map((s, k) => ({ label: s.label, bg: k === step ? \"#0A0C11\" : \"transparent\", fg: k === step ? \"#fff\" : \"#0A0C11\", select: (e) => { e.stopPropagation(); this.setState({ caseStep: k }); } })),\n      caseStepText: CASE.sections[step].text,\n      caseStepStatus: \"Step \" + (step + 1) + \" of \" + CASE.sections.length,\n      caseOnOutcome: step === CASE.sections.length - 1,\n      caseHasNext: step < CASE.sections.length - 1,\n      caseNextLabel: step < CASE.sections.length - 1 ? CASE.sections[step + 1].label : \"\",\n      caseNext: (e) => { e.stopPropagation(); this.setState({ caseStep: Math.min(step + 1, CASE.sections.length - 1) }); }\n    };\n    return {\n      ...caseVals,\n      contactOpen: this.state.contact,\n      copyLabel: this.state.copied ? \"Copied\" : \"Copy\",\n      openContact: (e) => { e.preventDefault(); e.stopPropagation(); this.setState({ contact: true, copied: false }); },\n      closeContact: (e) => { e.stopPropagation(); this.setState({ contact: false }); },\n      stop: (e) => e.stopPropagation(),\n      copyEmail: async (e) => {\n        e.stopPropagation();\n        try { await navigator.clipboard.writeText(\"d.bodaikina@gmail.com\"); } catch (_) {\n          const ta = document.createElement(\"textarea\"); ta.value = \"d.bodaikina@gmail.com\"; document.body.appendChild(ta); ta.select(); document.execCommand(\"copy\"); ta.remove();\n        }\n        this.setState({ copied: true });\n        clearTimeout(this.copyT); this.copyT = setTimeout(() => this.setState({ copied: false }), 1800);\n      },\n      whaleWrap: this.whaleWrap,\n      whaleTail: this.whaleTail,\n      panels: data.map(([title, body, slotHint, media], i) => ({\n        num: String(i + 1).padStart(2, \"0\"),\n        title, body, slotHint,\n        slotId: \"panel-\" + (i + 1),\n        mediaCss: media ? \"url(\" + media + \")\" : \"none\",\n        isAbout: i === 0,\n        isCase: i === 3,\n        stacked: i === 2,\n        isBio: i === 4,\n        isQuote: i === 1,\n        sideBySide: false,\n        bullets: Array.isArray(body) ? body.map(b => Array.isArray(b) ? { label: b[0], text: b[1] } : { label: \"\", text: b }) : [],\n        hasBullets: Array.isArray(body),\n        noBullets: !Array.isArray(body),\n        hasMedia: !!media,\n        noMedia: !media,\n        grow: active === i ? 100 : 1,\n        gapPx: active === i ? \"8px\" : \"0px\",\n        expanded: active === i,\n        collapsed: active !== i,\n        open: () => this.goTo(i),\n        next: (e) => { e.stopPropagation(); this.setState({ active: (i + 1) % data.length }); }\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
